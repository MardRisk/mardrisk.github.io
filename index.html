<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MardRisk AI — Your Online Financial Companion</title>
<script>
(function(){
  var lang = localStorage.getItem('mardriskai_lang');
  if(!lang){
    var nav = navigator.language||navigator.userLanguage||'en';
    if(nav.startsWith('hy')||nav.startsWith('am')) lang='am';
    else if(nav.startsWith('ru')) lang='ru';
    else lang='en';
  }
  window.location.replace('./'+lang+'/index.html');
})();
</script>
</head>
<body></body>
</html>
